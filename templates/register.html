{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <h1>Create Account</h1>
  <p>Register to generate a company DID and request verification.</p>
  <form class="card" method="post" action="/register">
    {{ form.hidden_tag() }}
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form.email.data or '' }}" placeholder="you@example.com" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Min. 8 characters" required>
    <div class="actions" style="justify-content:center;">
      <button type="submit" style="width:100%;">Create Account</button>
    </div>
    <p style="text-align:center; margin-top:12px; font-size:13px;">Already have an account? <a href="/login" style="color:var(--text); font-weight:600;">Log in</a></p>
  </form>
</div>
{% endblock %}
