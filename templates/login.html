{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <h1>Welcome Back</h1>
  <p>Log in to manage your DIDs, credentials, and metadata.</p>
  <form class="card" method="post" action="/login">
    {{ form.hidden_tag() }}
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form.email.data or '' }}" placeholder="you@example.com" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Your password" required>
    <div class="actions" style="justify-content:center;">
      <button type="submit" style="width:100%;">Log In</button>
    </div>
    <div style="text-align:center; margin-top:12px;">
      <a href="/forgot" style="font-size:13px; color:var(--text-muted);">Forgot password?</a>
    </div>
    <p style="text-align:center; margin-top:8px; font-size:13px;">No account yet? <a href="/register" style="color:var(--text); font-weight:600;">Register</a></p>
  </form>
</div>
{% endblock %}
